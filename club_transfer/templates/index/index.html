{% extends "layout.html" %}
{% load static %}

{% block title %}社團轉社系統登入{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'index/index.css' %}">
<script src="{% static 'index/index.js' %}" defer></script>
{% endblock %}

{% block content %}
<main class="login-page">
    <section class="login-panel" aria-labelledby="login-title">
        <div class="login-heading">
            <p class="eyebrow">社團轉社系統</p>
            <h1 id="login-title">登入</h1>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">帳號</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div id="login-error" class="error-message" role="alert" hidden></div>

            <button id="login-submit" type="submit" class="btn-primary">登入</button>
        </form>
    </section>
</main>
{% endblock %}
