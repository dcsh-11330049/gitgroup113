{% extends "layout.html" %}
{% load static %}

{% block title %}學生儀表板 - 社團轉社系統{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'dashboards/dashboard.css' %}">
<script src="{% static 'dashboards/student_dashboard.js' %}" defer></script>
{% endblock %}

{% block content %}
<header class="dashboard-header">
    <div class="header-left">
        <h1>學生儀表板</h1>
    </div>
    <div class="header-right">
        <span id="user-name">{{ user.name }}</span>
        <button id="logout-btn" class="btn-logout">登出</button>
    </div>
</header>

<main class="dashboard-container">
    <nav class="tabs" aria-label="學生儀表板分頁">
        <button class="tab-btn active" data-tab="my-club" type="button">我的社團</button>
        <button class="tab-btn" data-tab="transfer" id="transfer-tab" type="button" hidden>轉社申請</button>
        <button class="tab-btn" data-tab="all-clubs" type="button">所有社團</button>
    </nav>

    <section id="my-club" class="tab-content active">
        <div class="section-heading">
            <h2>我的社團</h2>
        </div>
        <div id="my-club-container" class="card-grid"></div>
    </section>

    <section id="transfer" class="tab-content">
        <div class="section-heading">
            <h2>轉社申請</h2>
            <p id="transfer-window-message" class="muted"></p>
        </div>
        <form id="transfer-form" class="inline-form">
            <label>
                目前社團
                <select id="transfer-current-club" name="original_club_id" required></select>
            </label>
            <label>
                目標社團
                <select id="transfer-target-club" name="new_club_id" required></select>
            </label>
            <button type="submit" class="btn-primary">送出轉社申請</button>
        </form>
        <div id="transfer-status"></div>
        <h3>我的轉社申請紀錄</h3>
        <div id="my-transfer-applications" class="card-grid"></div>
    </section>

    <section id="all-clubs" class="tab-content">
        <div class="section-heading">
            <h2>所有社團</h2>
        </div>
        <div class="table-wrap">
            <table id="clubs-table" class="clubs-table">
                <thead>
                    <tr>
                        <th scope="col">社團</th>
                        <th scope="col">社長</th>
                        <th scope="col">指導老師</th>
                        <th scope="col">人數</th>
                        <th scope="col">狀態</th>
                        <th scope="col">操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>

<div id="club-modal" class="modal" hidden>
    <div class="modal-content">
        <button class="modal-close" type="button" aria-label="關閉">&times;</button>
        <h2 id="modal-club-name"></h2>
        <div class="modal-tabs" aria-label="社團詳細資料分頁">
            <button class="modal-tab active" data-tab="info" type="button">社團介紹</button>
            <button class="modal-tab" data-tab="documents" type="button">文件</button>
            <button class="modal-tab" data-tab="modify" id="modify-tab" type="button" hidden>修改</button>
        </div>

        <div id="info" class="modal-tab-content active">
            <div id="club-info"></div>
        </div>

        <div id="documents" class="modal-tab-content">
            <div id="club-documents"></div>
        </div>

        <div id="modify" class="modal-tab-content">
            <form id="modify-form">
                <div class="form-group">
                    <label for="description">社團介紹</label>
                    <textarea id="description" name="description" rows="6"></textarea>
                </div>
                <div class="form-group">
                    <label for="description_url">社團介紹網址</label>
                    <input type="url" id="description_url" name="description_url">
                </div>
                <div class="form-group">
                    <label for="description_files">社團介紹文件</label>
                    <input type="file" id="description_files" name="files" multiple>
                </div>
                <button type="submit" class="btn-primary">送出審核</button>
                <div id="modify-status"></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
